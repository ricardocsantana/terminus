databases:
  - name: terminus
    plan: free
    databaseName: terminus
    postgresMajorVersion: 18
    user: terminus
    ipAllowList: []

services:
  - type: web
    name: terminus-web
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /up
    runtime: docker
    dockerCommand: /bin/sh -c "bundle exec sidekiq -r ./config/sidekiq.rb & exec bundle exec puma --config ./config/puma.rb"
    envVars:
      - key: API_URI
        value: http://0.0.0.0:10000
      - key: APP_SETUP
        value: true
      - key: HANAMI_PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: terminus
          property: connectionString
      - key: KEYVALUE_URL
        fromService:
          type: keyvalue
          name: terminus-keyvalue
          property: connectionString

  - type: keyvalue
    name: terminus-keyvalue
    plan: free
    ipAllowList: []
